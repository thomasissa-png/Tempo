regles:
  frequence: 'octobre : 1er et 3e mardi (bimensuel) ; novembre à mars : chaque mardi ; avril à septembre : bimensuel ; source de vérité : Config.SEO_SEASON_SCHEDULE'
  alternance: 3 articles neufs pour 1 rafraîchissement (REFRESH) ; les bilans mensuels sont des articles neufs data-driven
  longueur: 1200-2000 mots (piliers > 1200, satellites > 800)
  style: vouvoiement, ton expert accessible, réponse directe dans les 40 à 60 premiers mots, zéro tiret cadratin
  saisonnalite:
    nov_mars: jours rouges, chauffage, alertes, bilans mensuels
    avril_aout: bilans, préparation, comparatifs, équipements, evergreen
    sept_oct: rentrée Tempo, guides nouveaux abonnés, premier jour rouge
  clusters: chaque article rattaché à un cluster ; satellite vers pilier obligatoire, pilier vers tous ses satellites ; min 2 liens entrants par article
  maillage: min 5 liens internes par article (3 blog + /calendrier + /#subscribe + pilier) et au moins 1 lien vers /tarif-tempo-edf, /couleur-tempo-demain, /api-tempo ou /methodologie quand le sujet s'y
    prête
  anti_cannibalisation: pas de doublon d'intention de recherche ; chaque item indique l'article existant à ne pas dupliquer
  anti_repetition: 'vérifier articles_publies et prochaines_semaines avant tout nouveau sujet : jamais deux fois le même sujet avec le même angle'
  featured_snippets: au moins 1 élément optimisé par article (tableau, liste, définition 40-60 mots)
  donnees: chiffres historiques uniquement depuis la section donnees_reelles de _seo_rules.yaml ou une requête sur la table actuals ; jamais d'estimation ni de moyenne inventée
  sources_externes: pages d'accueil officielles (edf.fr, cre.fr, rte-france.com, legifrance.gouv.fr) ou URL exacte déjà présente dans le repo
  validation: python3 validate_article.py articles/{slug}.md (0 erreur) + titre 50-65 caractères + description 140-155 caractères + validation fondateur sur les 5 premiers articles neufs
